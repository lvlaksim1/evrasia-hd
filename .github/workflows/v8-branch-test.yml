name: V8 Branch Build Test

on:
  push:
    branches:
      - fix/v8-media-drag

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build v8 candidate
        id: build
        uses: ./.github/actions/build-apk
        with:
          release_number: "8"

      - name: Verify launcher and media
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.build.outputs.apk_path }}"
          grep -Fq 'android:name=".IntroActivity"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/raw/evrasia_hd_glitch.mp4
