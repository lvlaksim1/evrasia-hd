name: V9 Install Transparent Logo

on:
  push:
    branches:
      - v9-work

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[v9-logo-ready]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9-work
          fetch-depth: 0

      - name: Reconstruct transparent logo
        shell: bash
        run: |
          set -euo pipefail
          cat assets/.v9/logo.* | base64 -d > assets/evrasia_hd_logo.png
          echo "935a52492868d083469f52e13e99219d23db6287479dd4931eb64b6ad96845b3  assets/evrasia_hd_logo.png" | sha256sum -c -
          test "$(stat -c%s assets/evrasia_hd_logo.png)" = "14931"

      - name: Commit transparent logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/evrasia_hd_logo.png
          git rm -f assets/evrasia_hd_logo.jpg
          git rm -r assets/.v9
          git commit -m "v9: install transparent default logo [v9-logo-ready]"
          git push origin HEAD:v9-work
