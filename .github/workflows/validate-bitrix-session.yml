name: Validate Bitrix Session Recovery Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-bitrix-session.yml"
      - "lib/evrasia-api.ts"
      - "plugins/with-sms-code.js"
      - "docs/browser-otp-login.md"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/_release-apk.yml
    with:
      mode: validate
      expected_package_id: com.evrasia.hd
