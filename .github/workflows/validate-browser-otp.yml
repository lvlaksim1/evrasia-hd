name: Validate Browser OTP Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-browser-otp.yml"
      - "App.tsx"
      - "lib/evrasia-api.ts"
      - "docs/browser-otp-login.md"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/_release-apk.yml
    with:
      mode: validate
      expected_package_id: com.evrasia.hd
