name: V7 Fresh Lockfile

on:
  push:
    branches:
      - experiment/v7-no-router

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[v7-fresh-lock]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v7-no-router
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recreate lockfile from scratch
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Commit fresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "v7: recreate dependency lockfile [v7-fresh-lock]"
          git push origin HEAD:experiment/v7-no-router
