name: Validate Browser Session and PIN Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-browser-session.yml"
      - "App.tsx"
      - "lib/evrasia-api.ts"
      - "plugins/with-sms-code.js"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/_release-apk.yml
    with:
      mode: validate
      expected_package_id: com.evrasia.hd
