name: One-time removal of approved stale branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-clean-branches.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete precisely identified obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Not running outside main"
            exit 1
          fi
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "Refusing to delete main"
              exit 1
            fi
            actual="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$actual" ]; then
              echo "Already absent: $branch"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Branch tip changed, refusing to delete: $branch; actual $actual expected $expected"
              exit 1
            fi
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" > /dev/null
            echo "Deleted: $branch"
            sleep 5
          done <<'APPROVED_BRANCHES'
          apk-size-audit-work|2f92a040219b6eaa60851e2030c5a8158ee3285b
          atomic-reorder-commit-work|da0589584322ee8d95cfb5134f95e310614f8dcd
          dependabot/github_actions/dot-github/actions/build-apk/github-actions-97c448d1e7|525938a05e01525037d136b4c02443fa790eff13
          drag-reorder-fix-work|1281826b329afbc51afd688f053dd0a4553abd42
          experiment/v7-no-router|06ca6557d9050edbaf61f918dc99dd5e7a1b6d26
          experiment/v8-no-custom-media|dc982b8c18918237587167ec18e96afc80949cfe
          fix/v8-media-drag|cc929dcc1947a957d1f2990c81140c4ad30cfaa8
          native-dex-analysis-work|7ae75ec6faa42c6a7a9eb3cdf9b9e14673bb6a20
          remove-drag-scale-work|fbf706795d1a2e173a44f92e0f815cb9474d1ada
          telegram-apk-delivery-work|58762324e83ba94aae71bf19e845f1555a45975f
          v9-work|c894ba5bb84bad37f048af9b80bb8ce88592419d
          variable-height-drag-work|e82e5599dbbb03dcc72d216e1db94575c5f99e90
          APPROVED_BRANCHES
          remaining="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)"
          printf 'Remaining branches:\n%s\n' "$remaining"
          test "$remaining" = "main"
          echo "Cleanup verified: only main remains"
