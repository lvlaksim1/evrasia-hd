name: Validate Android updater APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-android-updater.yml"
      - "App.tsx"
      - "app.config.ts"
      - "lib/evrasia-update.ts"
      - "plugins/with-update-installer.js"
      - ".github/workflows/_release-apk.yml"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/_release-apk.yml
    with:
      mode: validate
      expected_package_id: com.evrasia.hd
