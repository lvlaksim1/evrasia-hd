name: V8 Custom Media Size A-B

on:
  push:
    branches:
      - experiment/v8-no-custom-media

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install signing tools
        shell: bash
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Build no-custom-media candidate
        id: build
        uses: ./.github/actions/build-apk
        with:
          release_number: "8"

      - name: Sign and measure
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          CANDIDATE_APK: ${{ steps.build.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/android-signing"
          SIGN_ZIP="$RUNNER_TEMP/android-signing.zip"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGN_ZIP"
          unzip -q "$SIGN_ZIP" -d "$SIGN_DIR"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --key "$SIGN_DIR/key.pk8" --cert "$SIGN_DIR/cert.pem" --out no-custom-media-v8.apk "$CANDIDATE_APK"
          "$APKSIGNER" verify no-custom-media-v8.apk
          SIZE=$(stat -c%s no-custom-media-v8.apk)
          SHA=$(sha256sum no-custom-media-v8.apk | awk '{print $1}')
          echo "SIGNED_APK_SIZE=$SIZE"
          echo "SIGNED_APK_SHA256=$SHA"
          {
            echo "## A/B custom media size"
            echo
            echo "Signed APK without custom logo/video: **$SIZE bytes**"
            echo
            echo "SHA-256: `$SHA`"
          } >> "$GITHUB_STEP_SUMMARY"
